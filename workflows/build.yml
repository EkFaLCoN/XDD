name: Build PluginDenetci

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Repo kökündeki zip'i açar; zip yoksa kökte build.gradle aranır
      - name: Zip'i aç ve proje klasörünü bul
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP" ]; then
            mkdir -p _src
            unzip -q -o "$ZIP" -d _src
            GRADLE_FILE=$(find _src -name build.gradle | head -n 1)
          else
            GRADLE_FILE=$(find . -maxdepth 2 -name build.gradle | head -n 1)
          fi
          if [ -z "$GRADLE_FILE" ]; then
            echo "build.gradle bulunamadı"; exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Derle
        run: cd "$PROJECT_DIR" && gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PluginDenetci
          path: ${{ env.PROJECT_DIR }}/build/libs/PluginDenetci.jar

      # Telefondan kolay indirmek için "latest" sürümüne jar eklenir
      - name: latest sürümüne yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest "$PROJECT_DIR/build/libs/PluginDenetci.jar" \
            --title "PluginDenetci (latest)" \
            --notes "Otomatik derleme"
